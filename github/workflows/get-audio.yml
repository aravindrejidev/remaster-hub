name: Get audio
on:
  workflow_dispatch:
    inputs:
      url: { description: "Google Drive or Dropbox share link", required: true }
      name: { description: "Save as, e.g. aigiri-nandini.flac", required: true }
      kind: { description: "Folder", type: choice, options: [remastered, original], default: remastered }
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
      NAME: ${{ inputs.name }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          OUT="public/audio/$KIND/$(basename "$NAME")"
          mkdir -p "$(dirname "$OUT")"
          if [[ "$URL" == *drive.google.com* ]]; then
            pip install -q --break-system-packages gdown
            gdown --fuzzy "$URL" -O "$OUT"
          else
            curl -fL "${URL/dl=0/dl=1}" -o "$OUT"
          fi
          ls -lh "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add $NAME"
          git push
